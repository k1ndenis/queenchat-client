apply plugin: 'com.android.application'

import java.util.Properties
import java.util.Locale

// Signing material is deliberately local-only. Resolution order is Gradle
// property, environment variable, then android/keystore.properties.
def queenChatSigningProperties = new Properties()
def queenChatSigningPropertiesFile = rootProject.file('keystore.properties')
if (queenChatSigningPropertiesFile.exists()) {
    queenChatSigningPropertiesFile.withInputStream { queenChatSigningProperties.load(it) }
}
def queenChatSigningValue = { String name ->
    def value = project.findProperty(name)
    if (value == null || value.toString().trim().isEmpty()) {
        value = System.getenv(name)
    }
    if (value == null || value.toString().trim().isEmpty()) {
        value = queenChatSigningProperties.getProperty(name)
    }
    return value == null ? null : value.toString().trim()
}

def queenChatKeystorePath = queenChatSigningValue('QUEENCHAT_KEYSTORE_PATH')
def queenChatKeystorePassword = queenChatSigningValue('QUEENCHAT_KEYSTORE_PASSWORD')
def queenChatKeyAlias = queenChatSigningValue('QUEENCHAT_KEY_ALIAS')
def queenChatKeyPassword = queenChatSigningValue('QUEENCHAT_KEY_PASSWORD')
def queenChatReleaseSigningReady = [
        queenChatKeystorePath,
        queenChatKeystorePassword,
        queenChatKeyAlias,
        queenChatKeyPassword
].every { it != null && !it.isEmpty() }
def requireQueenChatReleaseSigning = {
    if (!queenChatReleaseSigningReady) {
        throw new GradleException(
                'Release signing is not configured. Set QUEENCHAT_KEYSTORE_PATH, ' +
                'QUEENCHAT_KEYSTORE_PASSWORD, QUEENCHAT_KEY_ALIAS, and ' +
                'QUEENCHAT_KEY_PASSWORD in the environment, ~/.gradle/gradle.properties, ' +
                'or the ignored android/keystore.properties file.'
        )
    }
}

android {
    namespace = "ru.queenchat.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ru.queenchat.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Every distributed APK must increment this monotonically. The native updater compares only this value.
        versionCode 2
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (queenChatReleaseSigningReady) {
                storeFile file(queenChatKeystorePath)
                storePassword queenChatKeystorePassword
                keyAlias queenChatKeyAlias
                keyPassword queenChatKeyPassword
            }
        }
    }
    buildTypes {
        release {
            // This is a release variant even during the signing-key migration.
            // It must never be distributed as a debuggable APK.
            debuggable false
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation platform('com.google.firebase:firebase-bom:34.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def servicesJSON = file('google-services.json')
if (!servicesJSON.exists() || servicesJSON.length() == 0) {
    throw new GradleException("Missing app/google-services.json. Native Firebase Cloud Messaging cannot work without the Firebase Android configuration.")
}
apply plugin: 'com.google.gms.google-services'

// This also protects broad tasks such as `assemble`: an incompletely
// configured release must fail instead of leaving an unsigned artifact.
tasks.configureEach { task ->
    if (task.name.toLowerCase(Locale.ROOT).contains('release')) {
        task.doFirst { requireQueenChatReleaseSigning() }
    }
}
