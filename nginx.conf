server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Service Worker должен обновляться без immutable cache, иначе браузер
    # может продолжать использовать старый PWA/FCM worker.
    location = /firebase-messaging-sw.js {
        try_files $uri =404;
        add_header Content-Type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Статические файлы - отдаём напрямую
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|json|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Manifest.json - специальная обработка
    location = /manifest.json {
        try_files $uri =404;
        add_header Content-Type application/json;
        add_header Cache-Control "no-cache";
    }

    # The app shell points to content-hashed assets. It must be revalidated on
    # every navigation so a deploy can switch clients to the new asset hash.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Загрузки изображений - прокси на API
    location /uploads/ {
        proxy_pass http://api:3002/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API запросы
    location /api {
        proxy_pass http://api:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /api/chats/ws {
        proxy_pass http://api:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Все остальные запросы - React приложение
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
